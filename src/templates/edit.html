{% extends "layout.html" %}

{% block title %} Reference Manager {% endblock %}
{% block body %}

<form action="{{ url_for('edit_reference', key=reference.key) }}" method="post">
    <label for="key">Key*</label>
    <input type="text" id="key" name="key" value="{{ reference.key or '' }}" required>
    <br />

    <label for="author">Author*</label>
    <input type="text" id="author" name="author" value="{{ reference.author or '' }}" required>
    <br />

    <label for="title">Title*</label>
    <input type="text" id="title" name="title" value="{{ reference.title or '' }}" required>
    <br />

    <label for="journal">Journal*</label>
    <input type="text" id="journal" name="journal" value="{{ reference.journal or '' }}" required>
    <br />

    <label for="year">Year*</label>
    <input type="text" id="year" name="year" value="{{ reference.year or '' }}" required>
    <br />

    <label for="volume">Volume</label>
    <input type="text" id="volume" name="volume" value="{{ reference.volume or '' }}">
    <br />

    <label for="number">Number.</label>
    <input type="text" id="number" name="number" value="{{ reference.number or '' }}">
    <br />

    <label for="pages">Pages</label>
    <input type="text" id="pages" name="pages" value="{{ reference.pages or '' }}">
    <br />

    <label for="month">Month</label>
    <input type="text" id="month" name="month" value="{{ reference.month or '' }}">
    <br />

    <label for="note">Note</label>
    <textarea id="note" name="note"
        rows="5" cols="33">{{ reference.note or '' }}</textarea>
    <br />

    <label for="doi">DOI</label>
    <input type="text" id="doi" name="doi" value="{{ reference.doi or '' }}">
    <br />

    <label for="issn">ISSN</label>
    <input type="text" id="issn" name="issn" value="{{ reference.issn or '' }}">
    <br />

    <label for="zblnumber">ZBL&ndash;number</label>
    <input type="text" id="zblnumber" name="zblnumber" value="{{ reference.zblnumber or '' }}">
    <br />

    <label for="eprint">E-print&ndash;information</label>
    <input type="text" id="eprint" name="eprint" value="{{ reference.eprint or '' }}">
    <br />

    <input type="submit" id="submit" name="submit" value="Add" />
</form>

{% endblock %}
