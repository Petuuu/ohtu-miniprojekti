{% extends "layout.html" %}

{% block title %} Reference Manager {% endblock %}
{% block body %}

{% with messages = get_flashed_messages() %}
    {% if messages %}
        {% for message in messages %}
            <p>{{ message }}</p>
        {% endfor %}
    {% endif %}
{% endwith %}

<form action="{{ url_for('edit_reference', key=reference.key) }}" method="post">
    <label for="entry_type">Type*</label>
    <select id="entry_type" name="entry_type" required>
        <option value="article" {% if reference.entry_type == "article" %}selected{% endif %}>Article</option>
        <option value="book" {% if reference.entry_type == "book" %}selected{% endif %}>Book</option>
        <option value="booklet" {% if reference.entry_type == "booklet" %}selected{% endif %}>Booklet</option>
        <option value="conference" {% if reference.entry_type == "conference" %}selected{% endif %}>Conference</option>
        <option value="inbook" {% if reference.entry_type == "inbook" %}selected{% endif %}>Inbook</option>
        <option value="incollection" {% if reference.entry_type == "incollection" %}selected{% endif %}>Incollection</option>
        <option value="inproceedings" {% if reference.entry_type == "inproceedings" %}selected{% endif %}>Inproceedings</option>
        <option value="manual" {% if reference.entry_type == "manual" %}selected{% endif %}>Manual</option>
        <option value="mastersthesis" {% if reference.entry_type == "mastersthesis" %}selected{% endif %}>Mastersthesis</option>
        <option value="misc" {% if reference.entry_type == "misc" %}selected{% endif %}>Misc</option>
        <option value="phdthesis" {% if reference.entry_type == "phdthesis" %}selected{% endif %}>Phdthesis</option>
        <option value="proceedings" {% if reference.entry_type == "proceedings" %}selected{% endif %}>Proceedings</option>
        <option value="techreport" {% if reference.entry_type == "techreport" %}selected{% endif %}>Techreport</option>
        <option value="unpublished" {% if reference.entry_type == "unpublished" %}selected{% endif %}>Unpublished</option>
    </select>
    <br />

    <label for="key">Key*</label>
    <input type="text" id="key" name="key" value="{{ reference.key or '' }}" required>
    <br />

    <label for="author">Author*</label>
    <input type="text" id="author" name="author" value="{{ reference.author or '' }}" required>
    <br />

    <label for="title">Title*</label>
    <input type="text" id="title" name="title" value="{{ reference.title or '' }}" required>
    <br />

    <label for="journal">Journal*</label>
    <input type="text" id="journal" name="journal" value="{{ reference.journal or '' }}" required>
    <br />

    <label for="year">Year*</label>
    <input type="text" id="year" name="year" value="{{ reference.year or '' }}" required>
    <br />

    <label for="volume">Volume</label>
    <input type="text" id="volume" name="volume" value="{{ reference.volume or '' }}">
    <br />

    <label for="number">Number.</label>
    <input type="text" id="number" name="number" value="{{ reference.number or '' }}">
    <br />

    <label for="pages">Pages</label>
    <input type="text" id="pages" name="pages" value="{{ reference.pages or '' }}">
    <br />

    <label for="month">Month</label>
    <input type="text" id="month" name="month" value="{{ reference.month or '' }}">
    <br />

    <label for="note">Note</label>
    <textarea id="note" name="note"
        rows="5" cols="33">{{ reference.note or '' }}</textarea>
    <br />

    <label for="doi">DOI</label>
    <input type="text" id="doi" name="doi" value="{{ reference.doi or '' }}">
    <br />

    <label for="issn">ISSN</label>
    <input type="text" id="issn" name="issn" value="{{ reference.issn or '' }}">
    <br />

    <label for="zblnumber">ZBL&ndash;number</label>
    <input type="text" id="zblnumber" name="zblnumber" value="{{ reference.zblnumber or '' }}">
    <br />

    <label for="eprint">E-print&ndash;information</label>
    <input type="text" id="eprint" name="eprint" value="{{ reference.eprint or '' }}">
    <br />

    <input type="submit" id="submit" name="submit" value="Add" />
</form>

{% endblock %}
